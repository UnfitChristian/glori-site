
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GLORÍ – Sacred Archetypes</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: linear-gradient(to bottom, #FFF3C4 0%, #FFC928 30%, #FFFFFF 100%);
      padding: 2rem;
      color: #222;
    }
    header {
      text-align: center;
      margin-bottom: 2rem;
    }
    h1 {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1.5rem;
    }
    .card {
      background: white;
      padding: 1rem;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      text-align: center;
    }
    .card h2 {
      font-size: 1.25rem;
      color: #4B2959;
    }
  </style>
</head>
<body>
  <header>
    <h1>Welcome to GLORÍ</h1>
    <p>Discover your sacred archetype</p>
  </header>
  <div class="grid">
    <div class="card"><h2>The Hammer</h2></div>
    <div class="card"><h2>The Balm</h2></div>
    <div class="card"><h2>The Wailer</h2></div>
    <div class="card"><h2>The Altarist</h2></div>
    <div class="card"><h2>The Luminary</h2></div>
    <div class="card"><h2>The Revenant</h2></div>
    <div class="card"><h2>The Wayfinder</h2></div>
  </div>
</body>
</html>
